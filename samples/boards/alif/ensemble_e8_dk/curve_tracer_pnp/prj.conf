CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Console and shell on the board's console UART (UART4 on RTSS-HP)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
# Plain terminals: no colour escape sequences
CONFIG_SHELL_VT100_COLORS=n

CONFIG_ADC_AD559X_ACQUISITION_THREAD_STACK_SIZE=768
